<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pass1 Vesuvius</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --st: max(env(safe-area-inset-top), var(--top, 0px)); color-scheme: light; --ink:#171412; --muted:#6F665F; --rule:#E2DCD3; --accent:#C14A1F; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#E9E4DC; overflow:hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; color:var(--ink); -webkit-tap-highlight-color: transparent; }
  .phone { position:relative; width:100%; max-width:430px; height:100dvh; max-height:900px; margin:0 auto; overflow:hidden; background:#F3E3CC; }
  @media (min-width:600px) { .phone { margin-top:20px; height:calc(100dvh - 40px); border-radius:36px; box-shadow:0 20px 60px rgba(23,20,18,.25); } }
  svg.full { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; user-select:none; -webkit-user-select:none; }
  svg.scene { opacity:0; pointer-events:none; transition: opacity .2s; }
  [data-scene="napoli"] #scene-napoli, [data-scene="oss"] #scene-oss, [data-scene="crater"] #scene-crater { opacity:1; pointer-events:auto; transition: opacity .35s .3s; }
  .stoplabel { transition: opacity .25s; }
  [data-scene]:not([data-scene="overview"]) .stoplabel { opacity:0; }
  .stop, .hiker, .tap { cursor:pointer; }

  .hero { position:absolute; top:0; left:0; right:0; padding:max(14px, var(--st)) 62px 30px; text-align:center; pointer-events:none;
    background:linear-gradient(rgba(246,236,221,.94) 0%, rgba(246,236,221,.7) 60%, rgba(246,236,221,0) 100%); transition: opacity .25s, transform .25s; }
  .hero .k { font-size:11px; font-weight:700; letter-spacing:.16em; color:var(--accent); text-transform:uppercase; }
  .hero b { display:block; font-size:52px; line-height:56px; font-weight:800; letter-spacing:-2px; font-variant-numeric: tabular-nums; }
  .hero span { display:block; font-size:13px; font-weight:600; color:var(--muted); }
  [data-scene]:not([data-scene="overview"]) .hero { opacity:0; transform: translateY(-20px); }

  .chev { position:absolute; top:max(12px, var(--st)); left:8px; width:44px; height:44px; border:0; background:transparent; color:#fff; filter: drop-shadow(0 1px 2px rgba(23,20,18,.6)); cursor:pointer; z-index:5; display:flex; align-items:center; justify-content:center; }
  [data-scene="overview"] .chev { color:var(--ink); filter:none; }
  .pull { position:absolute; top:max(10px, var(--st)); left:50%; transform:translateX(-50%); pointer-events:none; z-index:4; transition:opacity .3s; }
  .pull i { display:block; width:44px; height:5px; border-radius:3px; background:rgba(23,20,18,.35); }
  [data-scene="overview"] .pull { opacity:0; }
  .hint { position:absolute; left:50%; bottom:calc(100px + env(safe-area-inset-bottom)); transform:translateX(-50%); padding:8px 14px; border-radius:16px; background:rgba(23,20,18,.6); color:#fff; font-size:13px; font-weight:600; pointer-events:none; transition: opacity .4s; white-space:nowrap; }
  .hint.gone, [data-scene]:not([data-scene="overview"]) .hint { opacity:0; }

  .note { position:absolute; left:16px; right:16px; bottom:calc(100px + env(safe-area-inset-bottom)); padding:16px 18px 18px; border-radius:6px; background:#FBF7EE; box-shadow:0 10px 30px rgba(23,20,18,.28); transform: rotate(-.6deg) translateY(16px); opacity:0; pointer-events:none; transition: opacity .2s, transform .2s; z-index:6; max-height:calc(100% - 180px); overflow-y:auto; }
  .note.open { opacity:1; transform: rotate(-.6deg); pointer-events:auto; }
  .note:before { content:""; position:absolute; top:-6px; left:50%; width:12px; height:12px; margin-left:-6px; border-radius:50%; background:#C14A1F; box-shadow:0 2px 3px rgba(0,0,0,.3); }
  .note .x { position:absolute; top:6px; right:8px; border:0; background:transparent; font-size:22px; color:var(--muted); cursor:pointer; padding:4px 8px; }
  .kicker { font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); }
  h2 { margin:2px 0 12px; font-size:24px; letter-spacing:-.5px; }
  .row { display:flex; align-items:center; gap:12px; padding:11px 0; border-top:1px solid var(--rule); }
  .row:first-of-type { border-top:0; }
  .row .grow { flex:1; min-width:0; }
  .row small { display:block; color:var(--muted); font-size:13px; margin-top:2px; }
  .num { font-variant-numeric: tabular-nums; font-weight:700; }
  .btns { display:flex; gap:8px; margin-top:8px; }
  .btn { flex:1; border:0; border-radius:14px; padding:13px; font:600 15px inherit; font-family:inherit; background:var(--ink); color:#fff; cursor:pointer; }
  .btn.ghost { background:#fff; color:var(--ink); }
  .note p { margin:0 0 6px; color:var(--muted); font-size:14px; line-height:1.4; }

  .soundBtn { position:absolute; top:max(14px, var(--st)); right:14px; width:42px; height:42px; border-radius:21px; border:0; background:rgba(251,249,245,.95); box-shadow:0 3px 12px rgba(23,20,18,.18); cursor:pointer; z-index:5; display:flex; align-items:center; justify-content:center; color:var(--muted); }
  .soundBtn.on { color:var(--accent); }
  .soundBtn .waves { display:none; } .soundBtn.on .waves { display:inline; } .soundBtn.on .slash { display:none; }
  body.app .phone { max-width:none; max-height:none; height:100vh; margin:0; border-radius:0; box-shadow:none; }
  body.app .note { bottom:calc(16px + env(safe-area-inset-bottom)); }
  body.app .hint { bottom:calc(28px + env(safe-area-inset-bottom)); }
  .wave { animation: wave 6s ease-in-out infinite alternate; }
  @keyframes wave { from { transform: translateX(-6px); } to { transform: translateX(6px); } }
  .steam { animation: steam 5s ease-out infinite; transform-box: fill-box; transform-origin: center bottom; }
  .steam.b { animation-delay: -1.7s; } .steam.c { animation-delay: -3.3s; }
  @keyframes steam { 0% { opacity:0; transform: translate(0,6px) scale(.6); } 30% { opacity:.7; } 100% { opacity:0; transform: translate(10px,-26px) scale(1.5); } }
  .sway { animation: sway 3s ease-in-out infinite alternate; transform-box: fill-box; transform-origin: top center; }
  .sway.b { animation-delay: -1s; } .sway.c { animation-delay: -2s; }
  @keyframes sway { from { transform: rotate(-3deg); } to { transform: rotate(3deg); } }
  .gull { animation: gull 16s linear infinite; }
  @keyframes gull { 0% { transform: translate(-80px, 40px); } 100% { transform: translate(480px, -10px); } }
  .ferry { animation: ferry 60s linear infinite; }
  @keyframes ferry { from { transform: translateX(-40px); } to { transform: translateX(160px); } }
  .pen { animation: pen 1.2s steps(6) infinite; }
  @keyframes pen { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  .glow { animation: glow 1.6s ease-in-out infinite alternate; }
  @keyframes glow { from { opacity:.75; } to { opacity:1; } }
  @media (prefers-reduced-motion: reduce) { .wave, .steam, .sway, .gull, .ferry, .pen, .glow { animation:none; } }
</style></head>
<body>

  }

  // Napoli: the tarantella.
  const MEL = [[0, 3, 7, 12, 10, 7], [8, 7, 5, 3, 2, 0], [-5, 0, 3, 7, 5, 3], [2, 3, 5, 7, 7, null], [0, 3, 7, 12, 10, 7], [8, 7, 5, 3, 5, 7], [8, 7, 5, 3, 2, -1], [0, null, 0, -5, 0, null]];
  const BASS = [-24, -19, -24, -29, -24, -19, -29, -24];
  const AM = [-12, -9, -5], DM = [-12, -7, -4], EM = [-13, -10, -5];
  const CHORDS = [AM, DM, AM, EM, AM, DM, EM, AM];
  function tarBar(s, i, t0) {
    const e = s.e8, m = MEL[i];
    m.forEach((n, j) => { if (n == null) return; let len = 1; while (j + len < 6 && m[j + len] === null) len++;
      mando(s.bus, n + 12, t0 + j * e, len * e, .2); });
    for (let j = 0; j < 6; j++) { tamb(s.bus, t0 + j * e, j % 3 === 0 ? .14 : .05); if (j % 3 === 0) tamb(s.bus, t0 + j * e + e / 2, .04); }
    play(s.bus, BASS[i], t0, .5, 'nylon', -.2); play(s.bus, BASS[i] + 7, t0 + 3 * e, .38, 'nylon', -.2);
    [1, 2, 4, 5].forEach((j) => strum(s.bus, CHORDS[i], t0 + j * e, .13, j % 3 === 2));
  }

  const songs = { bay: { fn: bayBar, len: BAY.length, e8: .29 }, tar: { fn: tarBar, len: MEL.length, e8: .13 } };
  function tick(s) { // keeps about a second and a half of music queued, bar by bar
    if (!soundOn || !s.on) { s.timer = 0; return; }
    while (s.at < actx.currentTime + 1.5) { s.fn(s, s.bar % s.len, s.at); s.at += 6 * s.e8; s.bar++; }
    s.timer = setTimeout(() => tick(s), 300);
  }
  function musicSetup() {
    if (musicIn) return;
    musicIn = actx.createGain(); musicIn.gain.value = .55;
    const body = actx.createBiquadFilter(); body.type = 'peaking'; body.frequency.value = 200; body.gain.value = 5; body.Q.value = 1.2;
    const air = actx.createBiquadFilter(); air.type = 'peaking'; air.frequency.value = 2400; air.gain.value = -3; air.Q.value = .8;
    const tone = actx.createBiquadFilter(); tone.type = 'lowpass'; tone.frequency.value = 5200;
    const room = actx.createConvolver(), sr = actx.sampleRate, ir = actx.createBuffer(2, sr * 2.2, sr);
    for (let ch = 0; ch < 2; ch++) { const d = ir.getChannelData(ch); for (let i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 3.5) * (i < sr * .012 ? i / (sr * .012) : 1); }
    room.buffer = ir; const wet = actx.createGain(); wet.gain.value = .22;
    musicIn.connect(body).connect(air).connect(tone); tone.connect(master); tone.connect(room).connect(wet).connect(master);
    Object.values(songs).forEach((s) => { s.bus = actx.createGain(); s.bus.gain.value = 0; s.bus.connect(musicIn); s.on = false; s.at = 0; s.bar = 0; });
  }
  const MIX = { overview: { bay: .9 }, napoli: { tar: 1 }, oss: { bay: .25 }, crater: {} };
  function music() {
    musicSetup();
    const t = actx.currentTime, mix = MIX[scene] || {};
    Object.entries(songs).forEach(([k, s]) => {
      const v = mix[k] || 0;
      s.bus.gain.setTargetAtTime(v, t, v ? .8 : .5);
      clearTimeout(s.fade);
      if (v && !s.on) { s.on = true; if (s.at < t) { s.at = t + .15; s.bar = 0; } if (!s.timer) tick(s); }
      if (!v && s.on) s.fade = setTimeout(() => { s.on = false; }, 2500); // let it fade, then stop; it starts from the top next time
    });
  }
  function musicOff() { if (!musicIn) return; Object.values(songs).forEach((s) => { s.bus.gain.setTargetAtTime(0, actx.currentTime, .2); s.on = false; clearTimeout(s.timer); s.timer = 0; }); }
  function ambience() {
    if (!soundOn) return;
    const t = actx.currentTime;
    layers.sea.g.gain.setTargetAtTime(scene === 'overview' ? .06 : scene === 'napoli' ? .012 : 0, t, .6);
    layers.wind.g.gain.setTargetAtTime(scene === 'oss' ? .05 : scene === 'crater' ? .03 : 0, t, .6);
    layers.rumble.g.gain.setTargetAtTime(scene === 'crater' ? .7 : 0, t, .8);
    music();
  }
  function sound(on) {
    soundOn = on;
    if (on) { try { if (!actx) initAudio(); actx.resume && actx.resume(); } catch (e) { soundOn = false; } }
    else if (actx) { Object.values(layers).forEach((l) => l.g.gain.setTargetAtTime(0, actx.currentTime, .2)); musicOff(); }
    $('soundBtn').classList.toggle('on', soundOn);
    if (soundOn) ambience();
  }
  window.__pass1 = (d) => { D = d; render(); };
  render();
  post({ type: 'ready' });
  setTimeout(() => $('hint').classList.add('gone'), 4500);
  // Drag sideways along the panorama.
  let drag = null;
  world.addEventListener('pointerdown', (e) => { if (scene === 'overview') drag = { x: e.clientX, p: panX, moved: false }; });
  window.addEventListener('pointermove', (e) => {
    if (!drag) return; const dx = (e.clientX - drag.x) * VW / world.clientWidth;
    if (Math.abs(dx) > 3) drag.moved = true;
    panX = Math.max(-40, Math.min(440, drag.p - dx)); vb = home(); world.setAttribute('viewBox', vb.join(' '));
  });
  window.addEventListener('pointerup', () => { if (drag && drag.moved) { $('hint').classList.add('gone'); suppress = true; setTimeout(() => suppress = false, 50); } drag = null; });
  let suppress = false;
  window.addEventListener('resize', () => { if (scene === 'overview') { vb = home(); world.setAttribute('viewBox', vb.join(' ')); } });
  // Swipe down anywhere in a place to go back to the whole climb.
  let sy = null;
  app.addEventListener('pointerdown', (e) => { sy = scene !== 'overview' && !e.target.closest('.note') ? e.clientY : null; });
  app.addEventListener('pointerup', (e) => { if (sy != null && e.clientY - sy > 70) go('overview'); sy = null; });
})();
</script>
