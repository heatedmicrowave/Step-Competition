<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Pass1 Mountain</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&display=swap" rel="stylesheet">
<style>
  :root { --st: max(env(safe-area-inset-top), var(--top, 0px)); color-scheme: light; --page:#F4F1EC; --ink:#171412; --muted:#6F665F; --rule:#E2DCD3; --accent:#C14A1F; --accent2:#E0683A; }
  * { box-sizing: border-box; }
  html, body { margin:0; height:100%; background:#E9E4DC; overflow:hidden; }
  body { font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; color:var(--ink); -webkit-tap-highlight-color: transparent; }
  .phone { position:relative; width:100%; max-width:430px; height:100dvh; max-height:900px; margin:0 auto; overflow:hidden; background:#DCE4E7; }
  @media (min-width:600px) { .phone { margin-top:20px; height:calc(100dvh - 40px); border-radius:36px; box-shadow:0 20px 60px rgba(23,20,18,.25); } }
  svg#world { position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:none; cursor:grab; user-select:none; -webkit-user-select:none; }
  canvas#snow { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; opacity:0; transition:opacity .4s; }
  [data-scene="summit"] canvas#snow, [data-scene="base"] canvas#snow { opacity:1; }

  /* What shows at which zoom */
  .stoplabel, .overviewOnly { transition: opacity .25s; }
  [data-scene]:not([data-scene="overview"]) .stoplabel { opacity:0; pointer-events:none; transition:none; } /* gone at once, so they never balloon while zooming in */
  .bubble { opacity:0; transition: opacity .3s .35s; }
  [data-scene="base"] .bubble { opacity:1; }
  .plume { opacity:0; transition: opacity .5s; }
  [data-scene="summit"] .plume { opacity:1; }
  .stop { cursor:pointer; }
  .cloud { animation: drift 38s ease-in-out infinite alternate; }
  .cloud.b { animation-duration: 52s; animation-delay:-20s; }
  [data-scene="summit"] .cloud { animation-duration: 14s; }
  @keyframes drift { from { transform: translateX(-30px); } to { transform: translateX(40px); } }
  .bob { animation: bob .7s ease-in-out infinite alternate; }
  @keyframes bob { from { transform: translateY(0); } to { transform: translateY(-.6px); } }
  .smoke { animation: smoke 4s ease-out infinite; transform-box: fill-box; transform-origin:center; }
  @keyframes smoke { 0% { opacity:.0; transform: translate(0,0) scale(.6);} 30% {opacity:.55;} 100% { opacity:0; transform: translate(6px,-14px) scale(1.6);} }

  /* Today's steps: the main thing, no box */
  .hero { position:absolute; top:0; left:0; right:0; padding:max(14px, var(--st)) 64px 34px; text-align:center; pointer-events:none;
    background:linear-gradient(rgba(244,241,236,.92) 0%, rgba(244,241,236,.75) 55%, rgba(244,241,236,0) 100%); transition: opacity .25s, transform .25s; }
  .hero b { display:block; font-size:58px; line-height:60px; font-weight:800; letter-spacing:-2px; font-variant-numeric: tabular-nums; color:var(--ink); }
  .hero span { font-size:13px; font-weight:600; color:var(--muted); }
  .hero span i { font-style:normal; color:var(--accent); }
  [data-scene]:not([data-scene="overview"]) .hero { opacity:0; transform: translateY(-20px); }

  /* One menu button */
  .menuBtn { position:absolute; top:max(14px, var(--st)); right:max(14px, env(safe-area-inset-right)); width:42px; height:42px; border-radius:21px; border:0; background:rgba(251,249,245,.95); box-shadow:0 3px 12px rgba(23,20,18,.18); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; z-index:5; }
  .menuBtn i { display:block; width:16px; height:2px; border-radius:1px; background:var(--ink); }
  .menu { position:absolute; top:calc(max(14px, var(--st)) + 50px); right:max(14px, env(safe-area-inset-right)); width:220px; padding:6px; border-radius:18px; background:#FBF9F5; box-shadow:0 12px 34px rgba(23,20,18,.22); z-index:5; opacity:0; transform: translateY(-6px) scale(.98); transform-origin: top right; pointer-events:none; transition: opacity .18s, transform .18s; }
  .menu.open { opacity:1; transform:none; pointer-events:auto; }
  .menu button { display:flex; width:100%; align-items:center; gap:12px; text-align:left; border:0; background:transparent; padding:10px 10px; border-radius:12px; font:600 15px inherit; font-family:inherit; color:var(--ink); cursor:pointer; }
  .menu button:active, .menu button.on { background:#EEE8E0; }
  .menu button b { font-weight:600; }
  .menu button small { display:block; font-weight:500; font-size:12px; color:var(--muted); }
  .menu svg { flex:none; }
  .hint { position:absolute; left:50%; bottom:calc(96px + env(safe-area-inset-bottom)); transform:translateX(-50%); padding:8px 14px; border-radius:16px; background:rgba(23,20,18,.6); color:#fff; font-size:13px; font-weight:600; pointer-events:none; transition: opacity .4s; white-space:nowrap; }
  .hint.gone, [data-scene]:not([data-scene="overview"]) .hint { opacity:0; }

  /* Entering the town: a whole new scene */
  svg.scene { touch-action:none; position:absolute; inset:0; width:100%; height:100%; display:block; opacity:0; pointer-events:none; transition: opacity .2s; }
  [data-scene="base"] svg#town, [data-scene="hut"] svg#scene-hut, [data-scene="summit"] svg#scene-summit { opacity:1; pointer-events:auto; transition: opacity .35s .3s; }
  .sign { cursor:pointer; }
  .sign:active, [data-hut]:active, #hutBoard [data-act]:active { opacity:.75; }
  .sign.picked polygon { stroke-width:2.2; }
  .sign.picked .pin { opacity:1; }
  .sign .pin { opacity:0; transition: opacity .2s; }
  #hutBoard { transition: opacity .15s; }
  .bird { animation: fly 13s linear infinite; }
  @keyframes fly { 0% { transform: translate(-260px, 30px); } 50% { transform: translate(120px, 0px); } 100% { transform: translate(520px, 26px); } }
  .ibexHead { animation: graze 5s ease-in-out infinite; transform-box: fill-box; transform-origin: 20% 80%; }
  @keyframes graze { 0%, 55%, 100% { transform: rotate(0); } 65%, 85% { transform: rotate(28deg); } }
  @media (prefers-reduced-motion: reduce) { .bird { animation: none; transform: translate(120px, 0); } .ibexHead, .cloud, .bob, .smoke { animation: none; } }

  .panel { display:none !important; }
  /* Inside the app: full screen, the app's tab bar sits below */
  body.app .phone { max-width:none; max-height:none; height:100vh; margin:0; border-radius:0; box-shadow:none; }
  body.app .note { bottom:calc(16px + env(safe-area-inset-bottom)); }
  body.app .hint { bottom:20px; }
  body.app #nightBtn { display:none; }
  .note { position:absolute; left:max(16px, env(safe-area-inset-left)); right:max(16px, env(safe-area-inset-right)); bottom:calc(100px + env(safe-area-inset-bottom)); padding:16px 18px 18px; border-radius:6px; background:#FBF7EE; box-shadow:0 10px 30px rgba(23,20,18,.28); transform: rotate(-.6deg) translateY(16px); opacity:0; pointer-events:none; transition: opacity .2s, transform .2s; z-index:4; }
  .note.open { opacity:1; transform: rotate(-.6deg); pointer-events:auto; }
  .note:before { content:""; position:absolute; top:-6px; left:50%; width:12px; height:12px; margin-left:-6px; border-radius:50%; background:#C14A1F; box-shadow:0 2px 3px rgba(0,0,0,.3); }
  .note .x { position:absolute; top:6px; right:8px; border:0; background:transparent; font-size:22px; color:var(--muted); cursor:pointer; padding:4px 8px; }
  .note h2 { margin-bottom:10px; }
  .note .card { padding:0; background:transparent; box-shadow:none; }
  .soundBtn { position:absolute; top:max(14px, var(--st)); right:calc(max(14px, env(safe-area-inset-right)) + 50px); width:42px; height:42px; border-radius:21px; border:0; background:rgba(251,249,245,.95); box-shadow:0 3px 12px rgba(23,20,18,.18); cursor:pointer; z-index:5; display:flex; align-items:center; justify-content:center; color:var(--muted); }
  .soundBtn.on { color:var(--accent); }
  .soundBtn .waves { display:none; } .soundBtn.on .waves { display:inline; } .soundBtn.on .slash { display:none; }
  #flag { transform-origin: 158px 447px; transition: transform .45s cubic-bezier(.3,1.6,.5,1); }
  #mail.off #flag { transform: rotate(90deg); }
  .chalet { cursor:pointer; }
  .langs { display:flex; flex-wrap:wrap; gap:6px; }
  .langs .chip { cursor:pointer; font-size:13px; padding:6px 10px; }
  .langs .chip.on { background:var(--ink); color:#fff; }
  .note { max-height:calc(100% - 180px); overflow-y:auto; }
  .tab, .tab2, .mail { cursor:pointer; }
  /* Place panel */
  .panel { position:absolute; left:0; right:0; bottom:0; height:52%; background:var(--page); border-radius:24px 24px 0 0; box-shadow:0 -10px 30px rgba(23,20,18,.12); transform: translateY(105%); transition: transform .32s cubic-bezier(.2,.8,.2,1); display:flex; flex-direction:column; }
  [data-scene]:not([data-scene="overview"]) .panel { transform: translateY(0); }
  .exit { position:absolute; top:max(14px, var(--st)); left:max(14px, env(safe-area-inset-left)); height:42px; padding:0 16px 0 12px; border-radius:21px; border:0; background:rgba(251,249,245,.95); box-shadow:0 3px 12px rgba(23,20,18,.18); font:600 14px inherit; font-family:inherit; color:var(--ink); cursor:pointer; z-index:5; transition:opacity .2s; }
  [data-scene="overview"] .exit { opacity:0; pointer-events:none; }
  .chev { position:absolute; top:max(12px, var(--st)); left:max(8px, env(safe-area-inset-left)); width:44px; height:44px; border:0; background:transparent; color:#fff; opacity:.9; filter: drop-shadow(0 1px 1.5px rgba(23,20,18,.4)); cursor:pointer; z-index:5; transition:opacity .2s; display:flex; align-items:center; justify-content:center; }
  [data-scene="overview"] .chev { opacity:0; pointer-events:none; }
  .pull { position:absolute; top:max(10px, var(--st)); left:50%; transform:translateX(-50%); display:flex; flex-direction:column; align-items:center; gap:6px; pointer-events:none; z-index:4; transition:opacity .3s; }
  .pull i { width:44px; height:5px; border-radius:3px; background:rgba(23,20,18,.35); }
  .pull span { margin-top:44px; font-size:12px; font-weight:600; color:#fff; background:rgba(23,20,18,.55); padding:5px 10px; border-radius:12px; transition:opacity .4s; }
  .pull.quiet span { opacity:0; }
  [data-scene="overview"] .pull { opacity:0; }
  svg.scene.dragging { transition:none !important; }
  .nightOnly { opacity:0; transition: opacity .6s; }
  .nightShade { opacity:0; mix-blend-mode: multiply; pointer-events:none; transition: opacity .6s; }
  .dayOnly { transition: opacity .6s; }
  [data-night] .nightOnly { opacity:1; }
  [data-night] #skyText g text { fill:#E8E4DA; }
  [data-night] .nightShade { opacity:.78; }
  [data-night] .dayOnly { opacity:0; }
  [data-night] canvas#snow { opacity:.7; }
  .panel header { display:flex; align-items:center; justify-content:space-between; padding:10px max(20px, env(safe-area-inset-right)) 4px max(20px, env(safe-area-inset-left)); }
  .panel .back { visibility:hidden; }
  .back { border:0; background:transparent; font:600 14px inherit; font-family:inherit; color:var(--accent); padding:8px 0; cursor:pointer; }
  .grab { position:absolute; top:7px; left:50%; width:40px; height:5px; margin-left:-20px; border-radius:3px; background:var(--rule); }
  .body { overflow-y:auto; padding:2px max(20px, env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left)); }
  .kicker { font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--accent); }
  h2 { margin:2px 0 14px; font-size:26px; letter-spacing:-.5px; }
  .row { display:flex; align-items:center; gap:12px; padding:12px 0; border-top:1px solid var(--rule); }
  .row:first-of-type { border-top:0; }
  .row .grow { flex:1; min-width:0; }
  .row small { display:block; color:var(--muted); font-size:13px; margin-top:2px; }
  .num { font-variant-numeric: tabular-nums; font-weight:700; }
  .card { background:#fff; border-radius:18px; padding:14px 16px; margin-bottom:10px; box-shadow:0 1px 0 rgba(23,20,18,.04); }
  .card h3 { margin:0; font-size:17px; }
  .card p { margin:4px 0 10px; color:var(--muted); font-size:13px; }
  .track { height:6px; border-radius:3px; background:#EEE8E0; position:relative; }
  .track i { position:absolute; top:-3px; width:12px; height:12px; border-radius:50%; border:2px solid #fff; margin-left:-6px; }
  .btns { display:flex; gap:8px; margin-top:6px; }
  .btn { flex:1; border:0; border-radius:14px; padding:13px; font:600 15px inherit; font-family:inherit; background:var(--ink); color:#fff; }
  .btn.ghost { background:#fff; color:var(--ink); }
  .rank { width:22px; text-align:center; font-weight:800; color:var(--muted); font-variant-numeric: tabular-nums; }
  .me { background:#FBE9DF; margin:0 -10px; padding-left:10px; padding-right:10px; border-radius:12px; border-top-color:transparent; }
  .me + .row { border-top-color:transparent; }
  .chip[data-board] { cursor:pointer; }
  .chip { display:inline-block; font-size:12px; font-weight:600; padding:3px 8px; border-radius:8px; background:#EEE8E0; color:var(--muted); }
  .seg { display:flex; gap:6px; margin-bottom:8px; }
  .seg .chip.on { background:var(--ink); color:#fff; }
  .wind { border:1px solid var(--rule); background:#fff; border-radius:12px; padding:7px 10px; font:600 12px inherit; font-family:inherit; color:var(--muted); cursor:pointer; }
  .wind.on { color:var(--accent); border-color:var(--accent); }
  .note { margin-top:16px; font-size:12px; color:var(--muted); }
</style>
</head><body>

(() => {
  const app = document.getElementById('app');
  const svg = document.getElementById('world');

  const skyText = document.getElementById('skyText');
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduce && svg.pauseAnimations) { svg.pauseAnimations(); document.getElementById('town').pauseAnimations(); }

  // The world is 400 wide; the screen shows all of that width and a slice of its height.
  const TOP = -175, BOT = 960;
  const W = () => app.clientWidth, H = () => app.clientHeight;
  const vh = () => 400 * H() / W();
  const clampY = (y) => Math.max(TOP, Math.min(Math.max(TOP, BOT - vh()), y));
  let oy = TOP;                       // where you are on the mountain (top of screen)
  let oz = 400, ox = 0;                // zoom: how much of the 400-wide world is on screen
  const ovh = () => oz * H() / W();
  const overviewBox = () => [ox, oy, oz, ovh()];
  const clampAll = () => { oz = Math.max(110, Math.min(400, oz)); ox = Math.max(0, Math.min(400 - oz, ox)); oy = Math.max(TOP, Math.min(Math.max(TOP, BOT - ovh()), oy)); };
  // Each place: where it is, how close to zoom, and how far down the screen it sits (above the panel).
  const PLACE = {
    base:   { x: 120, y: 722, w: 176, f: .3 },
    hut:    { x: 178, y: 492, w: 156, f: .3 },
    summit: { x: 228, y: 122, w: 176, f: .34 },

  const placeBox = (p) => { const P = PLACE[p], w = P.w, h = w * H() / W(); return [P.x - w / 2, P.y - P.f * h, w, h]; };

  let cur = overviewBox(), raf = 0, scene = 'overview', insetTop = (window.__INIT && window.__INIT.insetTop) || 0;
  function set(box) {
    cur = box;
    svg.setAttribute('viewBox', box.map((v) => v.toFixed(2)).join(' '));
    // The steps drift at a slower pace than the ground, like part of the far sky.
    const notch = Math.max(0, insetTop * 400 / W() - 30);
    skyText.setAttribute('transform', 'translate(0 ' + ((box[1] - TOP) * .45 + notch).toFixed(2) + ')');
  }
  function fly(to, dur = 480) {
    cancelAnimationFrame(raf);
    const from = cur.slice(), t0 = performance.now(); dur = reduce ? 0 : dur;
    const ease = (t) => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
    const step = (now) => {
      const t = dur ? Math.min(1, (now - t0) / dur) : 1, k = ease(t);
      set(from.map((v, i) => v + (to[i] - v) * k));
      if (t < 1) raf = requestAnimationFrame(step);
    };
    raf = requestAnimationFrame(step);
  }
  set(overviewBox());

      top5: "This week's top 5", summitBook: 'Summit book', thisWeek: 'This week', swipeBack: 'Swipe down for the mountain', swipeToBase: 'Swipe down to base camp ↓',
      yourChalet: 'Your chalet', settings: 'Settings', watch: 'Watch', language: 'Language', bookName: 'Name in the summit book', notOnBoard: 'Not signed yet', account: 'Account', accountSub: 'Privacy, sign out',
      change: 'Change', edit: 'Edit', open: 'Open', invite: 'Invite', newChallenge: 'New challenge', newTitle: 'Where to?', newBody: 'Pick a climb or a route, then send your friends the invite code.', startOne: 'Start one', joinCode: 'Join with code',
      inClimb: 'In this challenge', kOf: '{a} of {b}', today: 'Today', thatsYou: "that's you", onTrail: 'on the trail', taunt: 'Taunt', signBook: 'Sign the summit book to see', signBook2: 'the world and your country.', joinBoard: 'Join the board →', plusToday: '+{n} today',
      leave: 'Leave', length: 'Length', starts: 'Starts', tomorrow: 'Tomorrow', startBtn: 'Start', comingSoon: 'Coming soon', lengths: ['1 day', '2 days', '1 week', '2 weeks', '1 month', '3 months'],
    },

      { id: 'c1', title: 'Matterhorn climb', sub: "44.6K of 150K · you're 2nd", kicker: 'Day 4 of 14', detail: "You're 2nd, 3,410 steps behind Seniorwidebody.", dots: [[20.8, '#4E7A4A'], [29.7, '#C14A1F'], [32, '#3E6C8A']],

      { id: 'c3', title: 'Vesuvius', sub: '#1 · 12.4K steps', kicker: 'Day 1 of 7', world: true, rows: [] },

    boards: [
      { key: 'world', label: 'World', rows: [{ rank: 1, name: 'alpenrose', sub: 'IT', steps: 118402 }, { rank: 2, name: 'Seniorwidebody', sub: 'US', steps: 96115 }, { rank: 3, name: 'kumo_walks', sub: 'JP', steps: 91870 }, { rank: 4, name: 'heatedmicrowave', sub: 'US', steps: 88509, me: true }, { rank: 5, name: 'Beatincheeks', sub: 'US', steps: 80233 }] },

  const post = (m) => { if (inApp) window.ReactNativeWebView.postMessage(JSON.stringify(m)); else preview(m); };
  function preview(m) {
    if (m.type === 'alerts') { D.alerts = !D.alerts; setMail(D.alerts); }

  }
  const TIPS = () => (T.tips && T.tips.length ? T.tips : [['', '']]);
  let tipN = Math.floor(Math.random() * 5);

  function go(name) {
    menu.classList.remove('open');
    closeNote();
    if (name === scene) return;
    scene = name;
    app.dataset.scene = name;

      const t = TIPS()[tipN++ % TIPS().length];

      document.querySelectorAll('.tipB').forEach((e) => e.textContent = t[1]);

  function renderSigns() {

      const y = 206 + i * 36, pts = '214,' + y + ' 368,' + y + ' 386,' + (y + 15) + ' 368,' + (y + 30) + ' 214,' + (y + 30);

  }
  // Tap a sign: a challenge with its own world (Vesuvius) opens it; any other shows on the noticeboard.
  function signTap(key) {
    if (key === 'new') { hutView = { k: 'new' }; return hutBoard(true); }

    if (soundOn && G.bp) { G.bp.frequency.setTargetAtTime(300 + 520 * g, actx.currentTime, .3); if (scene === 'summit') G.wind.gain.setTargetAtTime(.15 + .55 * g, actx.currentTime, .3); }
    if (!reduce) requestAnimationFrame(blow);
  }
  requestAnimationFrame(blow);

  // Friends on the trail, walking up as their steps come in.
  const NS = 'http://www.w3.org/2000/svg';
  const trail = document.getElementById('trail');
  const len = trail.getTotalLength();
  // Steps to a spot on the trail: the hut sits at 60% of the challenge (about where it really is,
  // by height), the summit at 100%.
  let hutLen = 0, best = 1e9;
  for (let l = 0; l < len; l += 1) { const q = trail.getPointAtLength(l), d = (q.x - 178) ** 2 + (q.y - 470) ** 2; if (d < best) { best = d; hutLen = l; } }
  const goal = () => (D.climb && D.climb.goal) || 100000;
  const at = (st) => { const f = Math.max(0, st) / goal(); return trail.getPointAtLength(f <= .6 ? f / .6 * hutLen : hutLen + Math.min(1, (f - .6) / .4) * (len - hutLen)); };
  const marks = $('marks'), wg = $('walkers');
  let walkers = [], me = null, todayTag = null, gainShown = false, TODAY = 0, tStart = performance.now();
  function renderHikers() {
    marks.innerHTML = ''; wg.innerHTML = ''; walkers = []; me = null;
    document.querySelector('[href="#ovMid"]').textContent = D.climb ? kfmt(goal()) : '';
    if (!D.climb) return;
    [.2, .4, .8].forEach((f) => {
      const q = at(goal() * f), x = q.x - 5, y = q.y;
      marks.insertAdjacentHTML('beforeend',
        '<line x1="' + x + '" y1="' + y + '" x2="' + x + '" y2="' + (y - 11) + '" stroke="#fff" stroke-width=".8"/>' +
        '<path d="M' + x + ' ' + (y - 11) + ' l6 2 l-6 2z" fill="#C14A1F"/>' +
        '<text x="' + (x - 2) + '" y="' + (y - 5) + '" text-anchor="end" font-size="7" font-weight="800" fill="#171412" stroke="#FBF9F5" stroke-width="2.2" paint-order="stroke" ' + FONT + '>' + kfmt(goal() * f) + '</text>');
    });
    { const q = at(goal() * .6);
      marks.insertAdjacentHTML('beforeend', '<text x="' + (q.x - 16) + '" y="' + (q.y - 18) + '" text-anchor="end" font-size="7" font-weight="800" fill="#171412" stroke="#FBF9F5" stroke-width="2.2" paint-order="stroke" ' + FONT + '>' + kfmt(goal() * .6) + '</text>'); }
    walkers = (D.climb.hikers || []).slice(0, 10).map((h) => ({ ...h, extra: 0 }));
    walkers.forEach((w, i) => {
      const g = document.createElementNS(NS, 'g'), inner = document.createElementNS(NS, 'g'), c = esc(w.c || '#8A7A71');
      inner.setAttribute('class', 'bob');
      inner.innerHTML =
        '<circle cx="0" cy="-6" r="12" fill="transparent"/>' +
        '<path d="M-1 0 L-1.6 4 M1 0 L1.6 4" stroke="#2E3440" stroke-width="1.1" stroke-linecap="round"/>' +
        '<rect x="-1.8" y="-5" width="3.6" height="5.4" rx="1.2" fill="' + c + '"/>' +
        '<circle cx="0" cy="-6.6" r="1.6" fill="#E8C3A4"/>' +
        '<g class="badge"><circle r="4.4" fill="' + c + '" stroke="#fff" stroke-width=".8"/>' +
        '<text y="1.8" text-anchor="middle" font-size="5" font-weight="800" fill="#fff" ' + FONT + '>' + esc(String(w.n || '?').slice(0, 2)) + '</text>' +
        '<text class="klabel" x="6" y="1.6" font-size="4.4" font-weight="800" fill="#171412" stroke="#FBF9F5" stroke-width="1.4" paint-order="stroke" ' + FONT + '>' + kfmt(w.st) + '</text></g>';
      g.appendChild(inner); g.setAttribute('data-who', i); g.style.cursor = 'pointer';
      if (w.me) g.setAttribute('class', 'meHiker');
      wg.appendChild(g); w.g = g;
      if (w.me) me = w;
    });
    // Your hiker goes on top, so you're never hidden behind a friend.
    if (me) wg.appendChild(me.g);
    // When the app opens: your hiker walks up by the steps you've done since last time.
    if (me && !gainShown && D.gain > 0) {
      gainShown = true; TODAY = Math.min(D.gain, me.st); tStart = performance.now();
      todayTag = document.createElementNS(NS, 'g');
      const label = tpl(T.plusToday, { n: fmt(TODAY) }), wdt = 10 + label.length * 3.3;
      todayTag.innerHTML = '<rect x="7" y="-25" width="' + wdt + '" height="11" rx="5.5" fill="#C14A1F"/><text x="' + (7 + wdt / 2) + '" y="-17.2" text-anchor="middle" font-size="6" font-weight="800" fill="#fff" ' + FONT + '>' + esc(label) + '</text>';
      todayTag.style.transition = 'opacity .8s'; me.g.appendChild(todayTag);
      requestAnimationFrame(walk);
    }
    place();
  }
  function hikerNote(i) {
    const w = walkers[i]; if (!w || !D.climb) return;
    openNote('hiker', '<div class="kicker">' + esc(D.climb.name) + ' · ' + esc(w.me ? T.thatsYou : T.onTrail) + '</div>' +
      '<h2 style="display:flex;align-items:center;gap:10px"><span style="flex:none;width:34px;height:34px;border-radius:17px;background:' + esc(w.c) + ';color:#fff;display:inline-flex;align-items:center;justify-content:center;font-size:16px">' + esc(String(w.n || '?').slice(0, 2)) + '</span>' + esc(w.name) + '</h2>' +
      '<div class="row"><div class="grow">' + esc(T.inClimb) + '<small>' + esc(tpl(T.kOf, { a: kfmt(w.st), b: kfmt(goal()) })) + '</small></div><span class="num">' + fmt(w.st) + '</span></div>' +
      '<div class="row"><div class="grow">' + esc(T.today) + (w.watch ? '<small>' + esc(w.watch) + '</small>' : '') + '</div><span class="num">' + fmt(w.today) + '</span></div>' +
      '<div class="btns">' + (w.me ? '' : '<button class="btn" data-act="taunt" data-id="' + esc(D.climb.id) + '" data-player="' + esc(w.id) + '">🔥 ' + esc(T.taunt) + '</button>') +
      '<button class="btn ghost" data-act="open" data-id="' + esc(D.climb.id) + '">' + esc(T.open) + '</button></div>');
  }
  // Friends close together: spread their badges side by side so they never sit on top of each other.
  function place() {
    const pts = walkers.map((w) => at(w.st + (w.extra || 0)));
    const far = scene === 'overview' && oz > 230, done = new Set();
    walkers.forEach((w, i) => {
      w.g.setAttribute('transform', 'translate(' + pts[i].x.toFixed(2) + ' ' + pts[i].y.toFixed(2) + ')');
      w.g.querySelector('.klabel').style.display = far ? 'none' : '';
      w.g.querySelector('.badge').setAttribute('transform', 'translate(0 -13)');
    });
    if (!far) return;
    walkers.forEach((w, i) => {
      if (done.has(i)) return;
      const bunch = walkers.map((v, j) => j).filter((j) => !done.has(j) && Math.hypot(pts[j].x - pts[i].x, pts[j].y - pts[i].y) < 16);
      if (bunch.length < 2) return;
      const cx = bunch.reduce((a, j) => a + pts[j].x, 0) / bunch.length, top = Math.min(...bunch.map((j) => pts[j].y));
      bunch.forEach((j, k) => {
        done.add(j);
        const bx = cx + (k - (bunch.length - 1) / 2) * 10.5, by = top - 13;
        walkers[j].g.querySelector('.badge').setAttribute('transform', 'translate(' + (bx - pts[j].x).toFixed(2) + ' ' + (by - pts[j].y).toFixed(2) + ')');
      });
    });
  }
  function walk(now) {
    const e = reduce ? 1 : Math.min(1, Math.max(0, (now - tStart - 600) / 2600)), ease = 1 - Math.pow(1 - e, 3);
    if (me) me.extra = -TODAY * (1 - ease);
    place();
    if (e < 1) requestAnimationFrame(walk);
    else if (todayTag && !todayTag.gone) { todayTag.gone = true; setTimeout(() => todayTag.style.opacity = 0, 2500); }
  }

  // ---- Draw everything from the data.
  function applyText() {
    document.querySelectorAll('[data-t]').forEach((e) => { const v = T[e.dataset.t]; if (typeof v === 'string') e.textContent = v; });
    document.querySelectorAll('[data-tu]').forEach((e) => { const v = T[e.dataset.tu]; if (typeof v === 'string') e.textContent = v.toUpperCase(); });
  }
  function render() {
    T = D.t || SAMPLE.t;
    document.documentElement.lang = D.lang || 'en';
    if (D.insetTop != null) { document.documentElement.style.setProperty('--top', D.insetTop + 'px'); if (D.insetTop !== insetTop) { insetTop = D.insetTop; if (scene === 'overview') set(cur); } }
    applyText();
    $('stepsNum').textContent = D.today == null ? '—' : fmt(D.today);
    $('syncLine').textContent = [D.watch, D.sync].filter(Boolean).join(' · ');
    $('weekNum').textContent = fmt(D.week);
    $('bestLabel').textContent = (T.bestDay + (D.best ? ' · ' + D.best.day : '')).toUpperCase();
    $('bestNum').textContent = D.best ? fmt(D.best.steps) + ' ' + T.steps : '—';
    const nm = $('chaletName'); nm.textContent = String(D.name || '').toUpperCase();
    if (nm.textContent.length > 16) { nm.setAttribute('textLength', '106'); nm.setAttribute('lengthAdjust', 'spacingAndGlyphs'); } else nm.removeAttribute('textLength');
    $('bookSub').textContent = (T.summitBook + ' · ' + fmt(4478) + ' M').toUpperCase();
    setMail(D.alerts);
    renderSigns(); hutBoard(); renderHikers(); renderTabs(); board();
    fitAll();
    reopen();
    if (scene === 'base') { const t = TIPS()[(tipN + TIPS().length - 1) % TIPS().length]; document.querySelectorAll('.tipA').forEach((e) => e.textContent = t[0]); document.querySelectorAll('.tipB').forEach((e) => e.textContent = t[1]); }
  }
  // Long words (Italian, Spanish...) squeeze to fit their sign instead of spilling off it.
  function fit(e, max) {
    e.removeAttribute('textLength'); e.removeAttribute('lengthAdjust');
    try { if (e.getComputedTextLength() > max) { e.setAttribute('textLength', max); e.setAttribute('lengthAdjust', 'spacingAndGlyphs'); } } catch (_) {}
  }
  function fitAll() { document.querySelectorAll('[data-fit]').forEach((e) => fit(e, +e.dataset.fit)); }
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitAll);
  window.__pass1 = (d) => { D = d; render(); };
  render();
  post({ type: 'ready' });

  // Snow: blowing sideways at the summit, falling softly in town.
  const cv = document.getElementById('snow'), cx = cv.getContext('2d');
  let flakes = [], snowRaf = 0, snowing = null;
  function size() {
    const r = cv.getBoundingClientRect(), d = Math.min(2, devicePixelRatio || 1);
    cv.width = r.width * d; cv.height = r.height * d; cx.setTransform(d, 0, 0, d, 0, 0);
  }
  function snow(mode) {
    if (reduce || mode === snowing) return;
    cancelAnimationFrame(snowRaf);
    snowing = mode;
    if (!mode) { setTimeout(() => { if (!snowing) cx.clearRect(0, 0, cv.width, cv.height); }, 450); return; }
    size();
    const r0 = cv.getBoundingClientRect(), windy = mode === 'wind';
    flakes = Array.from({ length: windy ? 140 : 70 }, () => ({ x: Math.random() * r0.width, y: Math.random() * r0.height * .55, r: .6 + Math.random() * (windy ? 1.8 : 1.6), s: windy ? 2 + Math.random() * 5 : .3 + Math.random() * .6, d: Math.random() * 6.28 }));
    let last = performance.now();
    const tick = (now) => {
      const dt = Math.min(50, now - last) / 16; last = now;
      const r = cv.getBoundingClientRect(), lim = r.height * .55;
      cx.clearRect(0, 0, r.width, r.height);
      cx.fillStyle = '#fff';
      const gust = windy ? .3 + 1.3 * windAt(now / 1000) : 0;
      for (const f of flakes) {
        f.d += .04 * dt;
        if (windy) { f.x += f.s * gust * dt; f.y += (Math.sin(f.d) * .6 + .25) * dt; }
        else { f.y += f.s * dt; f.x += Math.sin(f.d) * .3 * dt; }
        if (f.x > r.width + 10) { f.x = -10; f.y = Math.random() * lim; }
        if (f.y > lim) { f.y = -5; f.x = Math.random() * r.width; }
        cx.globalAlpha = windy ? .4 + f.r / 3 : .55 + f.r / 4;
        cx.beginPath(); cx.ellipse(f.x, f.y, f.r * (1 + gust * .8), f.r * (windy ? .7 : 1), 0, 0, 6.28); cx.fill();
      }
      snowRaf = requestAnimationFrame(tick);
    };
    snowRaf = requestAnimationFrame(tick);
  }

  // Sound for each place, made in the browser (no audio files): wind up top, cowbells and a
  // far-off yodel (with the mountain's echo) at the hut, the town's murmur and church bell below.
  let actx, out, G = {}, soundOn = false, timers = [], babble = 0;
  function initAudio() {
    actx = new (window.AudioContext || window.webkitAudioContext)();
    out = actx.createGain(); out.gain.value = .9; out.connect(actx.destination);
    const buf = actx.createBuffer(1, actx.sampleRate * 4, actx.sampleRate), d = buf.getChannelData(0);
    let b = 0; for (let i = 0; i < d.length; i++) { b = (b + .02 * (Math.random() * 2 - 1)) / 1.02; d[i] = b * 3.5; }
    const noise = (off) => { const n = actx.createBufferSource(); n.buffer = buf; n.loop = true; n.start(0, off); return n; };
    // wind
    const bp = actx.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 500; bp.Q.value = .7;
    const lfo = actx.createOscillator(); lfo.frequency.value = .13; const lg = actx.createGain(); lg.gain.value = 260;
    lg.gain.value = 60; lfo.connect(lg).connect(bp.frequency); lfo.start(); G.bp = bp;
    G.wind = actx.createGain(); G.wind.gain.value = 0; noise(0).connect(bp).connect(G.wind).connect(out);
    // town murmur: voices-ish formants that rise and fall at random
    G.town = actx.createGain(); G.town.gain.value = 0; G.town.connect(out);
    G.f = [420, 900, 1700].map((f, i) => {
      const fl = actx.createBiquadFilter(); fl.type = 'bandpass'; fl.frequency.value = f; fl.Q.value = 3;
      const g = actx.createGain(); g.gain.value = 0; noise(i * .9 + .3).connect(fl).connect(g).connect(G.town); return g;
    });
    // echo for the hut
    G.echo = actx.createDelay(); G.echo.delayTime.value = .42;
    const fb = actx.createGain(); fb.gain.value = .38; const lp = actx.createBiquadFilter(); lp.frequency.value = 1800;
    G.echo.connect(lp).connect(fb).connect(G.echo); lp.connect(out);
  }
  const now = () => actx.currentTime;
  function ring(parts, vol, decay, dest = out) {
    parts.forEach(([f, a]) => {
      const o = actx.createOscillator(), g = actx.createGain();
      o.frequency.value = f; g.gain.setValueAtTime(0, now()); g.gain.linearRampToValueAtTime(vol * a, now() + .005);
      g.gain.exponentialRampToValueAtTime(.0001, now() + decay);
      o.connect(g).connect(dest); o.start(); o.stop(now() + decay + .05);
    });
  }
  const churchBell = () => ring([[196, 1], [392, .5], [470, .35], [588, .25], [823, .12]], .09, 4.5);
  const cowbell = () => { const f = 520 + Math.random() * 160; [0, .32, .5].forEach((t, i) => setTimeout(() => soundOn && ring([[f, 1], [f * 1.505, .6], [f * 2.41, .3]], .045 - i * .01, .7), t * 1000 + Math.random() * 120)); };
  function yodel() {
    // "yo-de-lay-ee-oo": chest and head notes swapping, through a voice-like filter, then echoing off the rock
    const o = actx.createOscillator(); o.type = 'sawtooth';
    const vib = actx.createOscillator(), vg = actx.createGain(); vib.frequency.value = 5.6; vg.gain.value = 6; vib.connect(vg).connect(o.frequency);
    const f1 = actx.createBiquadFilter(), f2 = actx.createBiquadFilter(); f1.type = f2.type = 'bandpass'; f1.Q.value = 6; f2.Q.value = 8;
    const g = actx.createGain(), mix = actx.createGain(); mix.gain.value = .05;
    o.connect(f1); o.connect(f2); f1.connect(g); f2.connect(g); g.connect(mix); mix.connect(out); mix.connect(G.echo);
    const notes = [[294, 'o'], [587, 'e'], [440, 'o'], [740, 'e'], [587, 'o'], [880, 'e'], [740, 'o']];
    const V = { o: [480, 860], e: [330, 2200] };
    let t = now() + .05; g.gain.setValueAtTime(0, t);
    notes.forEach(([f, v], i) => {
      o.frequency.setTargetAtTime(f, t, .025); f1.frequency.setTargetAtTime(V[v][0], t, .03); f2.frequency.setTargetAtTime(V[v][1], t, .03);
      g.gain.setTargetAtTime(i === notes.length - 1 ? .9 : 1, t, .02);
      t += i === notes.length - 1 ? .7 : .22;
    });
    g.gain.setTargetAtTime(0, t, .12);
    o.start(); vib.start(); o.stop(t + 1); vib.stop(t + 1);
  }
  function ambience(name) {
    if (!soundOn) return;
    timers.forEach(clearTimeout); timers = []; clearInterval(babble);
    const mix = { overview: [.06, 0], base: [.03, 0], hut: [.1, 0], summit: [.5, 0] }[name];
    G.wind.gain.setTargetAtTime(mix[0], now(), .5);
    G.town.gain.setTargetAtTime(mix[1], now(), .5);
    const every = (fn, a, b) => { const go = () => { fn(); timers.push(setTimeout(go, (a + Math.random() * (b - a)) * 1000)); }; return go; };
    if (name === 'base') {
      timers.push(setTimeout(every(churchBell, 18, 30), 1500));
    }
    if (name === 'hut') {
      timers.push(setTimeout(every(cowbell, 4, 8), 600));
      timers.push(setTimeout(every(yodel, 16, 24), 1800));
    }
  }

  // iPhones mute web sound when the side switch is on silent. Marking the page as playback (and keeping a
  // silent clip looping) puts it in media mode, so it plays like music does. Your on/off choice is remembered.
  function unmute() {
    try { if (navigator.audioSession) navigator.audioSession.type = 'playback'; } catch (e) {}
    if (unmute.a) { unmute.a.play().catch(() => {}); return; }
    try {
      const sr = 8000, n = sr / 2, b = new ArrayBuffer(44 + n * 2), v = new DataView(b), w = (o, t) => [...t].forEach((c, i) => v.setUint8(o + i, c.charCodeAt(0)));
      w(0, 'RIFF'); v.setUint32(4, 36 + n * 2, true); w(8, 'WAVEfmt '); v.setUint32(16, 16, true); v.setUint16(20, 1, true); v.setUint16(22, 1, true); v.setUint32(24, sr, true); v.setUint32(28, sr * 2, true); v.setUint16(32, 2, true); v.setUint16(34, 16, true); w(36, 'data'); v.setUint32(40, n * 2, true);
      const a = new Audio(URL.createObjectURL(new Blob([b], { type: 'audio/wav' }))); a.loop = true; a.setAttribute('playsinline', ''); a.play().catch(() => {}); unmute.a = a;
    } catch (e) {}
  }
  const remember = (on) => { try { localStorage.setItem('pass1.sound', on ? '1' : '0'); } catch (e) {} };
  const wanted = () => { try { return localStorage.getItem('pass1.sound') === '1'; } catch (e) { return false; } };
  // The phone can pause web audio (a call, the app in the background): any touch wakes it again.
  document.addEventListener('pointerdown', () => { if (soundOn && actx && actx.state !== 'running') { unmute(); actx.resume && actx.resume(); } }, true);
  function sound(on) {
    soundOn = on; remember(on);
    if (on) unmute(); else if (unmute.a) unmute.a.pause();
    if (on) {
      try { if (!actx) initAudio(); actx.resume && actx.resume(); } catch (e) { soundOn = false; return; }
      ambience(scene);
    } else if (actx) {
      timers.forEach(clearTimeout); timers = []; clearInterval(babble);
      G.wind.gain.setTargetAtTime(0, now(), .2); G.town.gain.setTargetAtTime(0, now(), .2);
    }
    document.getElementById('soundBtn').classList.toggle('on', soundOn);
  }
  if (wanted()) setTimeout(() => sound(true), 300); // you left the sound on last time
})();
